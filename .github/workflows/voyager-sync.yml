name: Voyager Telemetry & Snake Sync

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate Voyager contribution snakes
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: sGokulaKumaran
          outputs: |
            dist/github-snake.svg?palette=github-light&color_snake=%23E11D48&color_dots=%23ebedf0,%23d8b4fe,%23a855f7,%237e22ce,%23581c87
            dist/github-snake-dark.svg?palette=github-dark&color_snake=%23FF2E63&color_dots=%23111322,%233b1d6e,%236d28d9,%239333ea,%23c084fc

      - name: Generate Voyager Telemetry SVG
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/update_telemetry.py --username sGokulaKumaran --out dist/telemetry.svg

      - name: Publish SVGs to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
