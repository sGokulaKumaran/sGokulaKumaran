name: Generate contribution snake

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: Platane/snk/svg-only@v3
        with:
          github_user_name: sGokulaKumaran
          outputs: |
            dist/github-snake.svg?palette=github-light&color_snake=#7c3aed&color_dots=#ebedf0,#bae6fd,#38bdf8,#0284c7,#0369a1
            dist/github-snake-dark.svg?palette=github-dark&color_snake=#c084fc&color_dots=#161b22,#1e3a5f,#0284c7,#38bdf8,#7dd3fc

      - uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
